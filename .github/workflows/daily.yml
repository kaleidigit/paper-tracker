name: Daily Paper Digest

on:
  schedule:
    # 工作日 08:37 CST = 00:37 UTC
    - cron: '37 0 * * 1-5'
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear DB cache (skip dedup, re-process all papers)'
        type: boolean
        default: false
        required: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEBUG: nodemailer*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Restore SQLite DB from cache (preserves dedup history across runs)
      # Skip when manually triggered with "Clear DB cache" checked
      - name: Restore DB cache
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.clear_cache) }}
        uses: actions/cache@v4
        with:
          path: |
            data/top/papers.db
            data/econ/papers.db
            data/law/papers.db
          key: papers-db-${{ github.run_id }}
          restore-keys: |
            papers-db-

      - name: SMTP pre-check
        env:
          SMTP_USER: ${{ secrets.EMAIL_USER }}
          SMTP_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          echo "=== credential diagnostics ==="
          echo "EMAIL_USER length: ${#SMTP_USER}"
          echo "EMAIL_PASS length: ${#SMTP_PASS}"
          echo "EMAIL_USER first 4 chars: ${SMTP_USER:0:4}"
          echo "EMAIL_PASS chars 1-2: ${SMTP_PASS:0:2}"

          echo "=== SMTP auth test (465 SSL) ==="
          node -e "
          const {createTransport} = require('nodemailer');
          const t = createTransport({
            host: 'smtp.126.com', port: 465, secure: true,
            auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASS },
            logger: true, debug: true
          });
          t.verify().then(r => { console.log('SMTP OK:', r); process.exit(0); })
           .catch(e => { console.error('SMTP 465 FAIL:', e.message); process.exit(1); });
          "

      - name: Run pipeline
        run: |
          DAY_OF_WEEK=$(TZ=Asia/Shanghai date +%u)  # 1=Mon ... 7=Sun
          if [ "$DAY_OF_WEEK" = "1" ]; then
            PUSH_DAYS=3  # Monday: cover weekend (Fri-Sun)
          else
            PUSH_DAYS=1
          fi
          cat > .env << EOF
          TZ=Asia/Shanghai
          OPENAI_COMPATIBLE_API_KEY=${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENTS="${{ secrets.EMAIL_RECIPIENTS }}"
          PUSH_DAYS=${PUSH_DAYS}
          EOF
          bash run.sh --days "${PUSH_DAYS}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      # Save updated DB for next run (always runs, even if pipeline failed)
      - name: Save DB cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            data/top/papers.db
            data/econ/papers.db
            data/law/papers.db
          key: papers-db-${{ github.run_id }}
