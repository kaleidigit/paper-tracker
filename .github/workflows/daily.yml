name: Daily Paper Digest

on:
  schedule:
    # 工作日 08:37 CST = 00:37 UTC
    - cron: '37 0 * * 1-5'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Configure secrets
        run: |
          DAY_OF_WEEK=$(TZ=Asia/Shanghai date +%u)  # 1=Mon ... 7=Sun
          if [ "$DAY_OF_WEEK" = "1" ]; then
            PUSH_DAYS=3  # Monday: cover weekend (Fri-Sun)
          else
            PUSH_DAYS=1
          fi
          cat > .env << EOF
          TZ=Asia/Shanghai
          OPENAI_COMPATIBLE_API_KEY=${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENTS=${{ secrets.EMAIL_RECIPIENTS }}
          PUSH_DAYS=${PUSH_DAYS}
          EOF

      - name: Run pipeline
        run: bash run.sh --days ${PUSH_DAYS}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
