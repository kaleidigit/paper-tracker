name: Daily Paper Digest

on:
  schedule:
    # 工作日 08:37 CST = 00:37 UTC
    - cron: '37 0 * * 1-5'
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear DB cache (skip dedup, re-process all papers)'
        type: boolean
        default: false
        required: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEBUG: nodemailer*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Restore SQLite DB from cache (preserves dedup history across runs)
      # Skip when manually triggered with "Clear DB cache" checked
      - name: Restore DB cache
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.clear_cache) }}
        uses: actions/cache@v4
        with:
          path: |
            data/top/papers.db
            data/econ/papers.db
            data/law/papers.db
          key: papers-db-${{ github.run_id }}
          restore-keys: |
            papers-db-

      - name: SMTP pre-check
        env:
          SMTP_USER: ${{ secrets.EMAIL_USER }}
          SMTP_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          echo "=== credential diagnostics ==="
          echo "EMAIL_USER length: ${#SMTP_USER}"
          echo "EMAIL_PASS length: ${#SMTP_PASS}"
          echo "EMAIL_USER: ${SMTP_USER:0:4}...${SMTP_USER: -4}"
          echo "EMAIL_PASS prefix: ${SMTP_PASS:0:2}"

          echo "=== raw SMTP auth via openssl (LOGIN method) ==="
          python3 -c "
          import base64, socket, ssl, sys, os
          user = os.environ['SMTP_USER']
          pwd = os.environ['SMTP_PASS']

          ctx = ssl.create_default_context()
          sock = socket.create_connection(('smtp.126.com', 465), timeout=10)
          ssock = ctx.wrap_socket(sock, server_hostname='smtp.126.com')

          def cmd(s, expect=''):
              if s:
                  ssock.send((s + '\r\n').encode())
              resp = b''
              while True:
                  chunk = ssock.recv(4096)
                  resp += chunk
                  if b'\r\n' in resp:
                      break
              text = resp.decode('utf-8', errors='replace').strip()
              print(f'  {text[:200]}')
              return text

          # Read greeting
          greeting = cmd(None)
          if not greeting.startswith('220'):
              print('FATAL: no SMTP greeting'); sys.exit(1)

          # EHLO
          ehlo = cmd('EHLO github-actions')

          # AUTH LOGIN
          auth = cmd('AUTH LOGIN')
          if not auth.startswith('334'):
              print('FATAL: AUTH LOGIN rejected'); sys.exit(1)

          # Username
          user_b64 = base64.b64encode(user.encode()).decode()
          resp = cmd(user_b64)
          if not resp.startswith('334'):
              print(f'FATAL: username rejected ({resp})'); sys.exit(1)

          # Password
          pass_b64 = base64.b64encode(pwd.encode()).decode()
          resp = cmd(pass_b64)
          if resp.startswith('235'):
              print('AUTH SUCCESS!')
          elif '535' in resp:
              print('AUTH FAILED: 535 - credentials rejected by server')
              print('The 126.com SMTP server is rejecting the authorization code.')
              print('The account may be locked or the auth code is invalid.')
              sys.exit(1)
          else:
              print(f'UNEXPECTED: {resp}')
              sys.exit(1)

          cmd('QUIT')
          ssock.close()
          " 2>&1

      - name: Run pipeline
        run: |
          DAY_OF_WEEK=$(TZ=Asia/Shanghai date +%u)  # 1=Mon ... 7=Sun
          if [ "$DAY_OF_WEEK" = "1" ]; then
            PUSH_DAYS=3  # Monday: cover weekend (Fri-Sun)
          else
            PUSH_DAYS=1
          fi
          cat > .env << EOF
          TZ=Asia/Shanghai
          OPENAI_COMPATIBLE_API_KEY=${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENTS="${{ secrets.EMAIL_RECIPIENTS }}"
          PUSH_DAYS=${PUSH_DAYS}
          EOF
          bash run.sh --days "${PUSH_DAYS}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      # Save updated DB for next run (always runs, even if pipeline failed)
      - name: Save DB cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            data/top/papers.db
            data/econ/papers.db
            data/law/papers.db
          key: papers-db-${{ github.run_id }}
